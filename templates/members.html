<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมาชิก | MSU LAW EXAM HUB</title><style>body{font:16px system-ui,sans-serif;background:#f2f7fc;color:#12304d;margin:0}header{background:#fff;padding:20px max(20px,calc((100vw - 960px)/2));border-bottom:1px solid #d9e4ef}main{max-width:960px;margin:32px auto;padding:0 20px}.panel{background:white;border:1px solid #dbe7f3;border-radius:16px;padding:24px;margin-bottom:20px}input,button{font:inherit;padding:12px;border-radius:9px;margin:5px 0}input{border:1px solid #abc;width:min(90%,400px);display:block}button{border:0;background:#176bc0;color:white;cursor:pointer}a{color:#176bc0}.stats{display:flex;gap:15px;flex-wrap:wrap}.stats span{padding:15px;background:#eef5fc;border-radius:10px}#msg{color:#b12b2b}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}</style></head><body><header><strong>⚖️ MSU LAW EXAM HUB — สมาชิกนิสิต</strong>　<a href="/">กลับหน้าหลัก</a></header><main><p id="msg" role="status"></p><section class="panel" id="auth"><h2>เข้าสู่ระบบสมาชิก</h2><input id="email" type="email" placeholder="อีเมล" autocomplete="email"><input id="password" type="password" placeholder="รหัสผ่าน" autocomplete="current-password"><button onclick="login()">เข้าสู่ระบบ</button><h3>ยังไม่มีบัญชี?</h3><input id="name" placeholder="ชื่อที่แสดงในระบบ"><button onclick="register()">สมัครสมาชิก</button><p>รหัสผ่านต้องมีอย่างน้อย 12 ตัวอักษร</p></section><section class="panel" id="profile" hidden><h2 id="welcome">บัญชีของฉัน</h2><button onclick="logout()">ออกจากระบบสมาชิก</button><div class="stats" id="stats"></div><h3>ประวัติคะแนน</h3><table><thead><tr><th>รายวิชา</th><th>คะแนน</th><th>วันที่</th></tr></thead><tbody id="history"></tbody></table><p>กลับไปหน้า <a href="/">ฝึกทำข้อสอบ</a> เพื่อทำแบบฝึกหัด และใช้ระบบบันทึกคะแนนจาก API สมาชิก</p></section></main><script>
const $=id=>document.getElementById(id);const msg=t=>$('msg').textContent=t;
async function api(path,method='GET',body){const r=await fetch(path,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'เกิดข้อผิดพลาด');return d}
async function login(){try{await api('/api/members/login','POST',{email:$('email').value,password:$('password').value});msg('');refresh()}catch(e){msg(e.message)}}
async function register(){try{await api('/api/members/register','POST',{email:$('email').value,password:$('password').value,displayName:$('name').value});msg('');refresh()}catch(e){msg(e.message)}}
async function logout(){await api('/api/members/logout','POST',{});refresh()}
async function refresh(){try{const u=await api('/api/members/me');$('auth').hidden=true;$('profile').hidden=false;$('welcome').textContent='สวัสดี '+u.displayName;const s=await api('/api/members/stats');$('stats').replaceChildren();for(const t of [`สอบ ${s.attempts} ครั้ง`,`ตอบ ${s.questions} ข้อ`,`คะแนนเฉลี่ย ${s.averagePercent}%`,`ฝึก ${s.subjects} วิชา`]){const el=document.createElement('span');el.textContent=t;$('stats').append(el)}const rows=await api('/api/members/attempts');$('history').replaceChildren();for(const r of rows){const tr=document.createElement('tr');for(const t of [r.subjectName,`${r.score}/${r.total}`,new Date(r.createdAt).toLocaleString('th-TH')]){const td=document.createElement('td');td.textContent=t;tr.append(td)}$('history').append(tr)}}catch(e){$('auth').hidden=false;$('profile').hidden=true}}
refresh();
</script></body></html>
